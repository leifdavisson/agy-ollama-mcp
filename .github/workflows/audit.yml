name: High-Assurance Mutation & Security Audit

on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-audit:
    name: Mutation Testing Audit (mutmut)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run mutmut mutation testing
        run: |
          mutmut run || true
          mutmut export-cicd-stats
          cat mutants/mutmut-cicd-stats.json

      - name: Verify Mutation Kill Rate Threshold (>= 85%)
        run: |
          python3 -c "
          import json
          with open('mutants/mutmut-cicd-stats.json') as f:
              stats = json.load(f)
          killed = stats.get('killed', 0) + stats.get('timeout', 0)
          total = stats.get('total', 1)
          rate = (killed / total) * 100.0
          print(f'Mutation Kill Score: {rate:.2f}% ({killed}/{total})')
          assert rate >= 85.0, f'Mutation kill rate {rate:.2f}% below threshold'
          "

      - name: Upload Mutation Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mutation-audit-report
          path: mutants/mutmut-cicd-stats.json
