name: CI / Automated V&V Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: V&V Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Strict Static Type Checking (mypy)
        run: |
          mypy --strict src/

      - name: Execute Test Suite & Enforce 100% Statement/Branch Coverage
        run: |
          pytest --cov=src --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=json:coverage.json tests/

      - name: Verify DO-178C Level A MC/DC Condition Independence
        run: |
          python3 scripts/verify_mcdc.py

      - name: Verify Requirements Traceability Matrix (RTM)
        run: |
          python3 scripts/generate_rtm.py

      - name: Verify Protocol Stdio Cleanliness (Zero Stdout Pollution)
        run: |
          python3 -c "
          import subprocess, json
          p = subprocess.Popen(['python3', '-m', 'ollama_bridge.server'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          init_req = json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {'protocolVersion': '2024-11-05', 'capabilities': {}, 'clientInfo': {'name': 'ci-test', 'version': '1.0'}}}) + '\n'
          stdout, stderr = p.communicate(input=init_req, timeout=5)
          assert stdout.strip().startswith('{'), f'Invalid JSON-RPC frame on stdout: {stdout}'
          resp = json.loads(stdout.strip())
          assert resp.get('id') == 1, f'Unexpected response ID: {resp}'
          print('✓ Stdio transport cleanly returns isolated JSON-RPC frame')
          "
