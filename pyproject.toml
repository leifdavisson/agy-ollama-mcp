[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-ollama-mcp"
version = "1.0.0"
description = "Ollama MCP Bridge for Google Antigravity CLI (agy) - Tiered Edge-Cloud Architecture"
readme = "README.md"
authors = [
    { name = "Leif Davisson" }
]
license = { text = "GNU AGPLv3" }
dependencies = [
    "mcp>=2.0.0",
    "requests>=2.31.0"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-bdd>=7.0.0",
    "hypothesis>=6.90.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "mutmut>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/leifdavisson/agy-ollama-mcp"
Repository = "https://github.com/leifdavisson/agy-ollama-mcp.git"
Issues = "https://github.com/leifdavisson/agy-ollama-mcp/issues"

[project.scripts]
ollama-mcp-bridge = "ollama_bridge.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/ollama_bridge"]
also_copy = ["tests"]
mutate_only_covered_lines = false
